openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Meridian API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enquiries
    description: Client enquiry submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /enquiries/move-money:
    post:
      operationId: submitMoveMoneyEnquiry
      tags: [enquiries]
      summary: Submit Move Money Abroad enquiry
      description: Submits a 7-step Move Money Abroad form, saves to DB and Google Sheets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveMoneyInput"
      responses:
        "201":
          description: Enquiry submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /enquiries/private-banking:
    post:
      operationId: submitPrivateBankingEnquiry
      tags: [enquiries]
      summary: Submit Private Banking Introduction enquiry
      description: Submits a 6-step Private Banking Introduction form, saves to DB and Google Sheets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivateBankingInput"
      responses:
        "201":
          description: Enquiry submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /enquiries/below-minimum:
    post:
      operationId: logBelowMinimumEnquiry
      tags: [enquiries]
      summary: Log a below-minimum Move Money Abroad enquiry
      description: Records that a visitor selected an amount below the minimum threshold (amount only, no contact details)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BelowMinimumInput"
      responses:
        "201":
          description: Submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BelowMinimumResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /enquiries/contact:
    post:
      operationId: submitContactEnquiry
      tags: [enquiries]
      summary: Submit Contact Us enquiry
      description: Submits the Contact Us form, saves to DB and Google Sheets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /enquiries/introduction-request:
    post:
      operationId: submitIntroductionRequest
      tags: [enquiries]
      summary: Submit homepage Request an Introduction form
      description: Submits the homepage introduction request form, saves to DB and Google Sheets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntroductionRequestInput"
      responses:
        "201":
          description: Submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MoveMoneyInput:
      type: object
      required:
        - amountRange
        - fundsLocation
        - destination
        - purpose
        - timeline
        - regulatedInstitution
        - fullName
        - countryOfResidence
        - whatsappNumber
        - emailAddress
      properties:
        amountRange:
          type: string
          description: "Approximate amount to move"
        fundsLocation:
          type: string
          description: "Current location of funds"
        destination:
          type: string
          description: "Intended destination for funds"
        purpose:
          type: string
          description: "Free-text purpose of the transfer"
        timeline:
          type: string
          description: "When looking to proceed"
        regulatedInstitution:
          type: string
          description: "Whether funds held with regulated institution"
        sourceOfFunds:
          type: string
          description: "Free-text explanation of how the funds were obtained"
        fundsAvailability:
          type: string
          description: "Whether the funds are currently available for transfer"
        transferAuthority:
          type: string
          description: "The client's authority to arrange the transfer"
        assistanceRequired:
          type: string
          description: "Free-text description of current arrangements and the assistance required"
        fullName:
          type: string
        countryOfResidence:
          type: string
        whatsappNumber:
          type: string
        emailAddress:
          type: string

    PrivateBankingInput:
      type: object
      required:
        - bankingRelationshipType
        - investableWealth
        - jurisdictions
        - timeline
        - fullName
        - countryOfResidence
        - whatsappNumber
        - emailAddress
      properties:
        bankingRelationshipType:
          type: string
          description: "Type of banking relationship sought"
        investableWealth:
          type: string
          description: "Approximate investable wealth"
        jurisdictions:
          type: array
          items:
            type: string
          description: "Jurisdictions of interest (multiple)"
        reasons:
          type: array
          items:
            type: string
          description: "Legacy multi-select reasons (superseded by purpose; optional)"
        purpose:
          type: string
          description: "Free-text description of what the client wants to achieve"
        sourceOfWealth:
          type: string
          description: "Free-text general source of wealth or funds"
        initialCapital:
          type: string
          description: "Approximate initial capital to place with a bank"
        motivation:
          type: string
          description: "Free-text reason for seeking a new banking relationship now"
        timeline:
          type: string
          description: "How soon to establish relationship"
        fullName:
          type: string
        countryOfResidence:
          type: string
        whatsappNumber:
          type: string
        emailAddress:
          type: string

    BelowMinimumInput:
      type: object
      required:
        - amountRange
      properties:
        amountRange:
          type: string
          description: "Amount range selected by the visitor"

    BelowMinimumResult:
      type: object
      required:
        - logged
      properties:
        logged:
          type: boolean

    ContactInput:
      type: object
      required:
        - fullName
        - emailAddress
        - phoneNumber
        - natureOfEnquiry
        - message
      properties:
        fullName:
          type: string
        emailAddress:
          type: string
        phoneNumber:
          type: string
        natureOfEnquiry:
          type: string
        message:
          type: string

    IntroductionRequestInput:
      type: object
      required:
        - fullName
        - emailAddress
        - region
      properties:
        fullName:
          type: string
        emailAddress:
          type: string
        region:
          type: string
        message:
          type: string

    EnquiryResult:
      type: object
      required:
        - referenceNumber
        - fullName
        - type
      properties:
        referenceNumber:
          type: string
          description: "Generated reference number for the enquiry"
        fullName:
          type: string
          description: "Client full name"
        type:
          type: string
          description: "Enquiry type: move-money, private-banking, contact or introduction-request"
        whatsappNumber:
          type: ["string", "null"]
          description: "WhatsApp number for the desk"
        whatsappLink:
          type: ["string", "null"]
          description: "wa.me link for the desk"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
