kind = "web"
previewPath = "/"
title = "Meridian"
version = "1.0.0"
id = "artifacts/meridian"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18722

[services.development]
run = "pnpm --filter @workspace/meridian run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/meridian", "run", "build" ]
serve = "static"
publicDir = "artifacts/meridian/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18722"
BASE_PATH = "/"
